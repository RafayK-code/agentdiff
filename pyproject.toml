[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdiff"
description = "Human inline comments on a diff, exported for any agent harness"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["pydantic>=2.0", "textual>=0.80"]
keywords = ["diff", "code-review", "comments", "agents", "llm", "tui", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/RafayK-code/agentdiff"
Issues = "https://github.com/RafayK-code/agentdiff/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "build>=1.2",
    "twine>=5.0",
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
agentdiff = "agentdiff.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agentdiff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentdiff = ["docs/agent-guide.md", "docs/tui-guide.md"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
